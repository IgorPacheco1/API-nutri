# Configurações sem segredo, versionadas no repositório.
# Banco de dados e outras credenciais ficam fora daqui: no application.yaml local
# (ignorado pelo git) ou nas variáveis de ambiente do Render.

# Origens que podem chamar a API pelo navegador (CORS), separadas por vírgula.
# Em produção, defina a variável de ambiente APINUTRI_CORS_ORIGENS.
apinutri.cors.origens=${APINUTRI_CORS_ORIGENS:http://localhost:5173}

# Importa a TACO na subida (tabela vazia) ou completa as categorias (tabela já populada).
apinutri.importador.habilitado=${APINUTRI_IMPORTADOR_HABILITADO:true}

# O Render atende em HTTPS na frente da aplicação; com isso a API enxerga o
# endereço público correto (Swagger "Try it out" e verificação de CORS).
server.forward-headers-strategy=framework
