# Configuração dos testes: banco H2 em memória (modo PostgreSQL), criado a partir das entidades.
# Assim os testes rodam sem precisar de um PostgreSQL instalado.
spring.datasource.url=jdbc:h2:mem:apinutri;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Os testes chamam o importador quando precisam dele.
apinutri.importador.habilitado=false
apinutri.cors.origens=http://localhost:5173, https://front.exemplo.com/
